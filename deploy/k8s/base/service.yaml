apiVersion: v1
kind: Service
metadata:
  name: apilot-api
  labels: { app.kubernetes.io/name: apilot, app.kubernetes.io/component: api }
spec:
  selector: { app.kubernetes.io/name: apilot, app.kubernetes.io/component: api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: apilot-worker-metrics
  labels: { app.kubernetes.io/name: apilot, app.kubernetes.io/component: worker }
spec:
  # Headless: nothing load-balances to the worker, this exists only so a
  # ServiceMonitor or a static scrape config has a stable name to resolve.
  clusterIP: None
  selector: { app.kubernetes.io/name: apilot, app.kubernetes.io/component: worker }
  ports:
    - { name: metrics, port: 9110, targetPort: metrics }
