apiVersion: v1
kind: Secret
metadata:
  name: apilot-secrets
type: Opaque
stringData:
  # PLACEHOLDERS. The base exists so `kustomize build` produces something complete;
  # every overlay replaces these. APILOT_ENV=prod makes the app refuse to start on
  # the fingerprint-secret default, so a deploy that forgets this fails loudly at
  # startup rather than quietly HMACing bank details with a value published in the
  # repository.
  APILOT_DATABASE_URL: "postgresql+asyncpg://apilot:apilot@postgres:5432/apilot"
  APILOT_REDIS_URL: "redis://redis:6379/0"
  APILOT_FINGERPRINT_SECRET: "replace-me-with-32-plus-random-bytes"
