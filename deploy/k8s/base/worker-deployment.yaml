apiVersion: apps/v1
kind: Deployment
metadata:
  name: apilot-worker
  labels: { app.kubernetes.io/name: apilot, app.kubernetes.io/component: worker }
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two workers briefly overlapping is safe (jobs are
  # id-deduplicated and every transition is a compare-and-set), but the surge costs
  # a second ONNX model load and a second connection pool for no benefit.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: apilot, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: apilot, app.kubernetes.io/component: worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9110"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # 120 = job_completion_wait (90) plus margin. arq finishes in-flight jobs on
      # SIGTERM up to that bound; anything longer is dropped and picked up by the
      # stale-job cron, which costs the invoice a 15-minute rescue cycle. The two
      # numbers must move together — a grace period shorter than the wait means the
      # kubelet kills jobs arq was still finishing, every rollout.
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: apilot:latest
          imagePullPolicy: IfNotPresent
          command: ["arq", "app.worker.WorkerSettings"]
          ports:
            - { name: metrics, containerPort: 9110 }
          envFrom:
            - configMapRef: { name: apilot-config }
            - secretRef: { name: apilot-secrets }
          # arq maintains a health key in Redis every health_check_interval (30s);
          # `arq --check` reads it and exits non-zero when it is stale. That is a
          # real liveness signal for a process with no HTTP server — the metrics
          # exporter would answer even if the event loop were wedged.
          livenessProbe:
            exec: { command: ["arq", "--check", "app.worker.WorkerSettings"] }
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 3
          resources:
            # Higher than the API: this process loads an ONNX embedding model and
            # rasterises PDFs.
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: uploads, mountPath: /data/uploads }
            - { name: tmp, mountPath: /tmp }
            # fastembed caches its model under $HOME.
            - { name: model-cache, mountPath: /home/apilot/.cache }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: apilot-uploads }
        - name: tmp
          emptyDir: {}
        - name: model-cache
          emptyDir: {}
