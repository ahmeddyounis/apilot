name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The whole pipeline runs with ZERO secrets: LLM calls use the deterministic
# FakeLLM, embeddings use FakeEmbeddings, and evals run in fixture mode.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: astral-sh publishes floating major tags only
      # through v7, so `@v9` does not resolve and every job fails to start.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Validate Prometheus alert rules
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/ops/prometheus:/ops" prom/prometheus:v3.7.3 \
            check rules /ops/alerts.yml

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: astral-sh publishes floating major tags only
      # through v7, so `@v9` does not resolve and every job fails to start.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: astral-sh publishes floating major tags only
      # through v7, so `@v9` does not resolve and every job fails to start.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Unit tests
        run: uv run pytest -m unit --cov=app --cov-report=term
      - name: Integration tests (testcontainers)
        run: uv run pytest -m integration

  evals:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: astral-sh publishes floating major tags only
      # through v7, so `@v9` does not resolve and every job fails to start.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Eval harness (fixture mode, gated against baseline)
        run: |
          uv run python -m evals.run --mode fixture --config naive --dataset v1 --check
          uv run python -m evals.run --mode fixture --config schema_retry --dataset v1 --check
          uv run python -m evals.run --mode fixture --config validation --dataset v1 --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-reports
          path: evals/reports/

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and validate every overlay
        run: |
          set -euo pipefail
          for overlay in deploy/k8s/overlays/*/; do
            echo "== $(basename "$overlay")"
            docker run --rm -v "$PWD/deploy/k8s:/work" -w /work \
              registry.k8s.io/kustomize/kustomize:v5.4.3 build "overlays/$(basename "$overlay")" \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 \
                  -strict -summary -kubernetes-version 1.31.0
          done

  image-smoke:
    name: Built image actually runs
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # docker-build proves the image compiles. Nothing had ever started it, so a
      # runtime-only failure — a missing dependency in the `embeddings` group, a bad
      # entrypoint — would have shipped green.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: apilot:ci
          cache-from: type=gha
      - name: Import check inside the image
        run: |
          docker run --rm apilot:ci python -c "
          import fastembed, onnxruntime            # the embeddings group
          from app.main import create_app          # the API entrypoint
          from app.worker import WorkerSettings    # the worker entrypoint
          print('imports ok')"
      - name: Serve /health from the built image
        run: |
          set -euo pipefail
          docker run -d --name apilot-smoke -p 8000:8000 apilot:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health | grep -q '"status":"ok"'
          # No database or Redis, so readiness must report degraded rather than lie.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health/ready)" = "503"
          docker rm -f apilot-smoke

  security:
    name: Dependency and image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Audit dependencies for known vulnerabilities
        run: uvx pip-audit --strict
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: apilot:scan
          cache-from: type=gha
      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: apilot:scan
          severity: HIGH,CRITICAL
          # The base image is Debian slim; a CRITICAL with no fix available is not
          # something this repo can act on, so it does not fail the build.
          ignore-unfixed: true
          exit-code: "1"

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
