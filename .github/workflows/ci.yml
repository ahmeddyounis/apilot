name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The whole pipeline runs with ZERO secrets: LLM calls use the deterministic
# FakeLLM, embeddings use FakeEmbeddings, and evals run in fixture mode.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: astral-sh publishes floating major tags only
      # through v7, so `@v9` does not resolve and every job fails to start.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: astral-sh publishes floating major tags only
      # through v7, so `@v9` does not resolve and every job fails to start.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: astral-sh publishes floating major tags only
      # through v7, so `@v9` does not resolve and every job fails to start.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Unit tests
        run: uv run pytest -m unit --cov=app --cov-report=term
      - name: Integration tests (testcontainers)
        run: uv run pytest -m integration

  evals:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact release: astral-sh publishes floating major tags only
      # through v7, so `@v9` does not resolve and every job fails to start.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Eval harness (fixture mode, gated against baseline)
        run: |
          uv run python -m evals.run --mode fixture --config naive --dataset v1 --check
          uv run python -m evals.run --mode fixture --config schema_retry --dataset v1 --check
          uv run python -m evals.run --mode fixture --config validation --dataset v1 --check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-reports
          path: evals/reports/

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
