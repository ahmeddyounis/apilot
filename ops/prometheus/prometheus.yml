# Two scrape targets, deliberately. The worker runs its own exporter on 9110 because
# it has no HTTP server of its own, and it is where the pipeline's metrics are
# actually incremented — scraping only the API would report a pipeline that never runs.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: apilot-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: apilot-worker
    static_configs:
      - targets: ["worker:9110"]
