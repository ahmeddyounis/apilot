[project]
name = "apilot"
version = "0.1.0"
description = "AI Invoice Intelligence API — agentic accounts-payable automation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ahmed Younis" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pgvector",
    "arq",
    "redis",
    "structlog",
    "python-multipart",
    "typer",
    "anthropic",
    "prometheus-fastapi-instrumentator",
    "aiofiles",
    "pypdfium2>=5.12.1",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "testcontainers[postgres,redis]",
    "types-aiofiles",
]
# Populated in later milestones (synthetic generator, local embeddings). Kept out of
# the default install so onnxruntime/playwright never weigh down core or CI-unit paths.
eval = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.File",
    "typer.Option",
    "typer.Argument",
    "app.api.deps.require_scopes",
    "app.api.deps.rate_limited",
]

[tool.ruff.lint.per-file-ignores]
# Compact `"...".split()` default for the currency allowlist beats a 20-line literal.
"app/core/config.py" = ["SIM905"]
# Alembic autogenerate emits long op.create_table lines; readability there is moot.
"alembic/versions/*" = ["E501"]
# Blocking-call rules target production event loops, not test bodies or one-shot scripts.
"tests/*" = ["ASYNC"]
"scripts/*" = ["ASYNC"]

[tool.mypy]
files = ["app", "tests"]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast tests, no I/O",
    "integration: requires Docker (testcontainers)",
    "eval_fixture: eval harness in fixture mode",
]
