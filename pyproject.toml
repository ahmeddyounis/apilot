[project]
name = "apilot"
version = "0.1.0"
description = "AI Invoice Intelligence API — agentic accounts-payable automation"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ahmed Younis" }]
requires-python = ">=3.13,<3.14"
# Version floors record the minimum each dependency is known to work at; uv.lock
# is the reproducible pin. Without floors, regenerating the lock could resolve to
# anything and nothing would say which APIs this code actually needs.
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31",
    "alembic>=1.18",
    "pgvector>=0.5",
    "arq>=0.28",
    "redis>=5.3",
    "structlog>=26.1",
    "python-multipart>=0.0.32",
    "typer>=0.27",
    "anthropic>=0.120",
    "prometheus-fastapi-instrumentator>=8.1",
    "aiofiles>=25.1",
    "pypdfium2>=5.12.1",
    "pillow>=12.3.0",
    "langgraph>=1.2.10",
    "rapidfuzz>=3.14.5",
    "scipy>=1.18.0",
    "mcp>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "testcontainers[postgres,redis]",
    "types-aiofiles",
    # The deployment-contract test parses the manifests. Available transitively today,
    # declared here so an unrelated upgrade cannot remove it.
    "pyyaml",
    "types-pyyaml",
]
# Local ONNX embeddings. Its own group because the runtime image needs it — near-
# duplicate detection silently degrades to hashed fallback vectors without it — while
# unit-test and lint CI paths shouldn't be carrying onnxruntime around.
embeddings = ["fastembed>=0.8.0"]
# Synthetic invoice generation for the eval harness. Kept out of the default install
# so playwright never weighs down core or CI-unit paths.
eval = [
    "faker>=40.36.0",
    "jinja2>=3.1.6",
    "playwright>=1.62.0",
    {include-group = "embeddings"},
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.File",
    "typer.Option",
    "typer.Argument",
    "app.api.deps.require_scopes",
    "app.api.deps.rate_limited",
]

[tool.ruff.lint.per-file-ignores]
# Compact `"...".split()` default for the currency allowlist beats a 20-line literal.
"app/core/config.py" = ["SIM905"]
# Alembic autogenerate emits long op.create_table lines; readability there is moot.
"alembic/versions/*" = ["E501"]
# Blocking-call rules target production event loops, not test bodies or one-shot scripts.
"tests/*" = ["ASYNC"]
"scripts/*" = ["ASYNC"]
"evals/*" = ["ASYNC"]

[tool.mypy]
files = ["app", "tests"]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pypdfium2.*", "scipy.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: fast tests, no I/O",
    "integration: requires Docker (testcontainers)",
    "eval_fixture: eval harness in fixture mode",
]
